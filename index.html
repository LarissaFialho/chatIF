<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatIF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="images-removebg-preview.png" width="60" alt="Logo ChatIF" class="header-logo">
    <h1>ChatIF</h1>
</header>

<main>
    <div class="login-box">
        <h2>Entrar</h2>
        <input type="text" id="user" placeholder="Usuário">
        <input type="password" id="pass" placeholder="Senha">
        <p id="error-msg" class="error-msg">Usuário ou senha incorretos!</p>
        <button onclick="login()">Entrar</button>
    </div>
</main>

<footer>

    <p><strong>IFRN Campus Santa Cruz</strong></p>

    <p><a href="desenvolvedores.html" style="color: #14c7bb; text-decoration: none; font-weight: bold;">Ver página de Desenvolvedores</a></p>

</body>
</html>
